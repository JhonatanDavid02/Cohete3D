<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Lanzamiento Espacial 3D | Pad-07A</title>
  <meta name="description" content="Simulador interactivo 3D de plataforma de lanzamiento espacial con Three.js. Cuenta regresiva, ignición, desacoplamiento mecánico, física de ascenso y telemetría HUD en tiempo real.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-deep: #040711;
      --panel-bg: rgba(10, 15, 28, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-hover: rgba(255, 255, 255, 0.12);
      --accent-cyan: #00e5ff;
      --accent-amber: #f59e0b;
      --accent-orange: #f97316;
      --accent-emerald: #10b981;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Overlay */
    .hud-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 28px;
      z-index: 10;
    }

    /* Top Header */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      pointer-events: auto;
    }

    .hud-badge {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .hud-indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      transition: all 0.3s ease;
      animation: hudPulse 2s infinite ease-in-out;
    }

    @keyframes hudPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .hud-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .hud-status {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #38bdf8;
      transition: color 0.3s ease;
    }

    .hud-telemetry-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      padding: 10px 16px;
      border-radius: 30px;
      font-family: var(--font-mono);
      font-size: 11px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .telemetry-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .telemetry-label {
      color: var(--text-muted);
    }

    .telemetry-value {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .telemetry-divider {
      color: rgba(255, 255, 255, 0.15);
    }

    /* Countdown Banner */
    .hud-countdown-banner {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      animation: scaleIn 0.3s ease-out;
    }

    .countdown-number {
      font-family: var(--font-mono);
      font-size: 80px;
      font-weight: 800;
      color: #f59e0b;
      text-shadow: 0 0 35px rgba(245, 158, 11, 0.8), 0 0 70px rgba(245, 158, 11, 0.4);
      letter-spacing: -2px;
    }

    .countdown-sub {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 3px;
      color: #f8fafc;
      background: rgba(10, 15, 28, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
    }

    @keyframes scaleIn {
      from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* Bottom Footer Dock */
    .hud-footer {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .hud-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .panel-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      padding-left: 4px;
    }

    .hud-btn-group {
      display: flex;
      gap: 4px;
    }

    .hud-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .hud-btn.active {
      background: rgba(0, 229, 255, 0.15);
      border-color: rgba(0, 229, 255, 0.4);
      color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }

    .hud-btn-launch {
      padding: 10px 22px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border: 1px solid #fb923c;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.45);
    }

    .hud-btn-launch:hover {
      background: linear-gradient(135deg, #fb923c, #f97316);
      box-shadow: 0 6px 25px rgba(249, 115, 22, 0.65);
      transform: translateY(-1px);
    }

    .hud-btn-reset {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
    }

    .hud-btn-reset:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    /* Interaction Hint */
    .hud-interaction-hint {
      position: absolute;
      bottom: 24px;
      right: 28px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .hud-interaction-hint .dot {
      color: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 900px) {
      .hud-interaction-hint { display: none; }
      .hud-container { padding: 16px; }
      .hud-header { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- HUD Overlay -->
  <div class="hud-container">
    <!-- Top Header -->
    <header class="hud-header">
      <div class="hud-badge">
        <div id="hud-dot" class="hud-indicator-dot"></div>
        <div class="hud-title-group">
          <div class="hud-tag">LAUNCH PLATFORM • PAD-07A</div>
          <div id="hud-status-text" class="hud-status">READY // ESPERA DE IGNICIÓN</div>
        </div>
      </div>

      <div class="hud-telemetry-pill">
        <span class="telemetry-item">
          <span class="telemetry-label">ALTITUD:</span>
          <span id="tel-alt" class="telemetry-value">0.0 m</span>
        </span>
        <span class="telemetry-divider">|</span>
        <span class="telemetry-item">
          <span class="telemetry-label">VELOCIDAD:</span>
          <span id="tel-vel" class="telemetry-value">0 km/h</span>
        </span>
        <span class="telemetry-divider">|</span>
        <span class="telemetry-item">
          <span class="telemetry-label">EMPUJE:</span>
          <span id="tel-thrust" class="telemetry-value">35% IDLE</span>
        </span>
      </div>
    </header>

    <!-- Countdown Banner -->
    <div id="countdown-banner" class="hud-countdown-banner" style="display: none;">
      <div id="countdown-number" class="countdown-number">T - 03</div>
      <div class="countdown-sub">SECUENCIA AUTOMÁTICA EN PROCESO</div>
    </div>

    <!-- Bottom Footer Dock -->
    <footer class="hud-footer">
      <div class="hud-panel" style="background: transparent; border: none; padding: 0;">
        <button id="btn-launch" type="button" class="hud-btn hud-btn-launch">
          <span>▲</span>
          <span>INICIAR DESPEGUE</span>
        </button>
        <button id="btn-reset" type="button" class="hud-btn hud-btn-reset" style="display: none;">
          <span>↺</span>
          <span>REINICIAR LANZAMIENTO</span>
        </button>
      </div>

      <div id="panel-potencia" class="hud-panel">
        <span class="panel-label">POTENCIA</span>
        <div class="hud-btn-group">
          <button type="button" class="hud-btn" onclick="setThrustMode('idle')">APAGADO</button>
          <button type="button" class="hud-btn active" onclick="setThrustMode('standby')">STANDBY</button>
          <button type="button" class="hud-btn" onclick="setThrustMode('test')">IGNICIÓN</button>
        </div>
      </div>

      <div class="hud-panel">
        <span class="panel-label">CÁMARA</span>
        <div class="hud-btn-group">
          <button type="button" class="hud-btn active" onclick="setCameraPreset('default')">PAD</button>
          <button type="button" class="hud-btn" onclick="setCameraPreset('rocket')">COHETE</button>
          <button type="button" class="hud-btn" onclick="setCameraPreset('engine')">MOTOR</button>
          <button type="button" class="hud-btn" onclick="setCameraPreset('tower')">TORRE</button>
          <button type="button" id="btn-autorotate" class="hud-btn" onclick="toggleAutoRotate()">GIRO</button>
        </div>
      </div>
    </footer>

    <!-- Hint -->
    <div class="hud-interaction-hint">
      <span>Arrastra para rotar</span>
      <span class="dot">•</span>
      <span>Rueda para zoom</span>
      <span class="dot">•</span>
      <span>Clic derecho para desplazar</span>
    </div>
  </div>

  <!-- Three.js y OrbitControls locales: Carga 100% directa y offline sin dependencias externas -->
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>

  <script>
    function initRocketApp() {
      if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
        setTimeout(initRocketApp, 40);
        return;
      }

      // Launch States & Physics Variables
      let launchPhase = 'standby'; // 'standby' | 'countdown' | 'ignition' | 'liftoff' | 'ascent' | 'cruising'
      let countdownVal = 3;
      let rocketY = 0;
      let velocity = 0;
      let armRetract = 0;
      let clampOpen = 0;
      let thrustMode = 'standby'; // 'idle' | 'standby' | 'test'
      let autoRotate = false;
      let phaseTimer = 0;
      let delugeSteamActive = false;

      // HUD Elements
      const hudDot = document.getElementById('hud-dot');
      const hudStatus = document.getElementById('hud-status-text');
      const telAlt = document.getElementById('tel-alt');
      const telVel = document.getElementById('tel-vel');
      const telThrust = document.getElementById('tel-thrust');
      const countdownBanner = document.getElementById('countdown-banner');
      const countdownNum = document.getElementById('countdown-number');
      const btnLaunch = document.getElementById('btn-launch');
      const btnReset = document.getElementById('btn-reset');
      const panelPotencia = document.getElementById('panel-potencia');
      const btnAutoRotate = document.getElementById('btn-autorotate');

      // ================= SETUP THREE.JS SCENE =================
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#030611');
      scene.fog = new THREE.FogExp2('#030611', 0.0075); // Atmospheric depth tuned for 20m aerospace vehicle

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.2, 500);
      const cameraTargetPos = new THREE.Vector3(14.5, 4.2, 16.0); // Hero low-angle launch pad perspective
      const cameraTargetLook = new THREE.Vector3(0, 6.0, 0);
      camera.position.copy(cameraTargetPos);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 3.5;
      controls.maxDistance = 85;
      controls.maxPolarAngle = Math.PI / 2 - 0.03;
      controls.target.copy(cameraTargetLook);

      // ================= DYNAMIC ENVIRONMENT REFLECTION MAP =================
      const pmremGen = new THREE.PMREMGenerator(renderer);
      pmremGen.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color('#030611');
      const el1 = new THREE.PointLight('#38bdf8', 16, 30);
      el1.position.set(12, 16, 12);
      envScene.add(el1);
      const el2 = new THREE.PointLight('#f97316', 12, 25);
      el2.position.set(-12, 8, -12);
      envScene.add(el2);
      const el3 = new THREE.PointLight('#ffffff', 10, 25);
      el3.position.set(0, 22, 0);
      envScene.add(el3);
      scene.environment = pmremGen.fromScene(envScene).texture;

      // ================= LIGHTING =================
      const ambLight = new THREE.AmbientLight('#0b1528', 0.85);
      scene.add(ambLight);

      const hemiLight = new THREE.HemisphereLight('#253655', '#060b14', 0.7);
      scene.add(hemiLight);

      // Primary Key Sun
      const dirKeyLight = new THREE.DirectionalLight('#f8fafc', 2.8);
      dirKeyLight.position.set(18, 30, 16);
      dirKeyLight.castShadow = true;
      dirKeyLight.shadow.mapSize.width = 2048;
      dirKeyLight.shadow.mapSize.height = 2048;
      dirKeyLight.shadow.camera.near = 0.5;
      dirKeyLight.shadow.camera.far = 70;
      dirKeyLight.shadow.camera.left = -16;
      dirKeyLight.shadow.camera.right = 16;
      dirKeyLight.shadow.camera.top = 28;
      dirKeyLight.shadow.camera.bottom = -4;
      dirKeyLight.shadow.bias = -0.0004;
      scene.add(dirKeyLight);

      // Blue Horizon Fill & Rim Light
      const rimLight = new THREE.DirectionalLight('#0284c7', 1.6);
      rimLight.position.set(-16, 14, -14);
      scene.add(rimLight);

      // Gantry Tower Work Floodlights
      const floodLight1 = new THREE.SpotLight('#f8fafc', 3.5, 30, 0.75, 0.6);
      floodLight1.position.set(-3.2, 16.0, 1.8);
      floodLight1.target.position.set(0, 14.0, 0);
      scene.add(floodLight1);
      scene.add(floodLight1.target);

      const floodLight2 = new THREE.SpotLight('#e2e8f0', 3.2, 26, 0.8, 0.6);
      floodLight2.position.set(-3.2, 8.0, 1.8);
      floodLight2.target.position.set(0, 6.5, 0);
      scene.add(floodLight2);
      scene.add(floodLight2.target);

      // Engine Plume Dynamic Illumination
      const flameLight = new THREE.PointLight('#ff5500', 0, 32, 1.8);
      flameLight.position.set(0, 1.0, 0);
      scene.add(flameLight);

      const coreGlowLight = new THREE.PointLight('#38bdf8', 0, 12, 2.0);
      coreGlowLight.position.set(0, 1.5, 0);
      scene.add(coreGlowLight);

      // Tower Top FAA Obstacle Warning Beacon
      const towerBeacon = new THREE.PointLight('#ef4444', 4.5, 18, 2);
      towerBeacon.position.set(-3.2, 22.4, -0.8);
      scene.add(towerBeacon);

      // ================= PROCEDURAL PBR TEXTURES (CANVAS GENERATORS) =================
      // 1. First Stage Booster Textures (Dedicated 1024x2048: aspect-ratio compensated, ZERO vertical distortion, NO dark bands)
      function generateBoosterTextures() {
        const width = 1024;
        const height = 2048;

        // Diffuse Canvas
        const cDiff = document.createElement('canvas');
        cDiff.width = width;
        cDiff.height = height;
        const ctx = cDiff.getContext('2d');

        // Pure Aerospace Thermal White Coating
        const bgGrad = ctx.createLinearGradient(0, 0, width, 0);
        bgGrad.addColorStop(0.00, '#edf1f7');
        bgGrad.addColorStop(0.25, '#f8fafc');
        bgGrad.addColorStop(0.50, '#e8edf4');
        bgGrad.addColorStop(0.75, '#fbfcfe');
        bgGrad.addColorStop(1.00, '#edf1f7');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // Fine vertical stringer seams (longitudinal stiffeners)
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.035)';
        ctx.lineWidth = 1;
        for (let x = 0; x < width; x += 64) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        // Realistic Tank Dome Friction-Stir Weld Seams (at authentic structural bulkhead heights)
        const weldSeams = [220, 640, 1060, 1480, 1880];
        weldSeams.forEach(y => {
          // Precision silver-alloy weld band
          ctx.fillStyle = 'rgba(180, 195, 215, 0.55)';
          ctx.fillRect(0, y - 3, width, 6);
          ctx.strokeStyle = 'rgba(100, 115, 135, 0.75)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();

          // Micro-fasteners
          ctx.fillStyle = 'rgba(70, 85, 105, 0.8)';
          for (let rx = 6; rx < width; rx += 18) {
            ctx.fillRect(rx, y - 5, 2, 2);
            ctx.fillRect(rx + 9, y + 3, 2, 2);
          }
        });

        // Cryogenic LOX Tank Frost Sublimation Band (upper-middle liquid oxygen section, y=280 to y=980)
        // Soft, natural crystalline frost gradient without any dark bands or artifacts
        const frostGrad = ctx.createLinearGradient(0, 260, 0, 980);
        frostGrad.addColorStop(0.00, 'rgba(255, 255, 255, 0.0)');
        frostGrad.addColorStop(0.12, 'rgba(255, 255, 255, 0.60)');
        frostGrad.addColorStop(0.48, 'rgba(255, 255, 255, 0.82)');
        frostGrad.addColorStop(0.82, 'rgba(255, 255, 255, 0.58)');
        frostGrad.addColorStop(1.00, 'rgba(255, 255, 255, 0.0)');
        ctx.fillStyle = frostGrad;
        ctx.fillRect(0, 260, width, 720);

        // Aspect-Ratio Compensated Optical Roll Tracking Targets (Square 2x2 checkerboards)
        // Physical aspect ratio is height (9.6m) / circumference (2.827m) = 3.4.
        // Canvas is 1024x2048 (2:1), so in 3D world space vertical is stretched by 3.4 / 2.0 = 1.7x.
        // We divide canvas height by 1.7 so that on the 3D model it displays as a 100% PERFECT SQUARE!
        const rollXPositions = [width * 0.125, width * 0.375, width * 0.625, width * 0.875];
        rollXPositions.forEach(cx => {
          [360, 1720].forEach(cy => {
            const w = 40;
            const h = Math.round(w / 1.7); // Compensate 1.7x vertical stretch in cylinder UV mapping
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(cx - w, cy - h, w, h);
            ctx.fillRect(cx, cy, w, h);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(cx, cy - h, w, h);
            ctx.fillRect(cx - w, cy, w, h);
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - w, cy - h, w * 2, h * 2);
          });
        });

        // Crisp Vector-sharp Aerospace Stencils (Aspect-compensated, perfectly sharp)
        ctx.save();
        [width * 0.22, width * 0.72].forEach(tx => {
          ctx.save();
          ctx.translate(tx, 1420);
          ctx.rotate(-Math.PI / 2);
          // Scale along the text direction to negate cylinder UV stretch
          ctx.scale(1 / 1.7, 1);
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 36px "Space Grotesk", sans-serif';
          ctx.fillText('PAD-07A // ORBITAL VEHICLE', 0, 0);
          ctx.font = '20px "JetBrains Mono", monospace';
          ctx.fillStyle = '#1e293b';
          ctx.fillText('STAGE 1: 9x VAC/SL ENGINES • LOX / RP-1', 0, 26);
          ctx.font = 'bold 16px "JetBrains Mono", monospace';
          ctx.fillStyle = '#d97706';
          ctx.fillText('SERNO: AV-7014X  •  DANGER CRYO VENT', 0, 48);
          ctx.restore();
        });
        ctx.restore();

        // 2. Bump Map (Raised weld lines & fasteners)
        const cBump = document.createElement('canvas');
        cBump.width = width / 2;
        cBump.height = height / 2;

      // Tangent Ogive Fairing Geometry (Continuous aerodynamic curvature with blunted apex)
      function createTangentOgiveGeometry(R, L, segmentsY = 36, segmentsRadial = 48) {
        // Tangent Ogive formula: rho = (R^2 + L^2) / (2 * R)
        // r(y) = sqrt(rho^2 - y^2) + R - rho, for y in [0, L]
        const rho = (R * R + L * L) / (2 * R);
        const points = [];

        for (let i = 0; i <= segmentsY; i++) {
          const t = i / segmentsY;
          const y = t * L;
          let r = Math.sqrt(Math.max(0, rho * rho - y * y)) + R - rho;

          // Spherical apex blunting to reflect aerodynamic heating protection
          if (t > 0.94) {
            const bluntFactor = (1 - t) / 0.06;
            r = r * Math.sin(bluntFactor * Math.PI * 0.5);
          }

          points.push(new THREE.Vector2(Math.max(0.001, r), y));
        }

        return new THREE.LatheGeometry(points, segmentsRadial);
      }

      // Rao 80% Parabolic Bell Nozzle Geometry
      function createRaoBellGeometry(rThroat, rExit, length, segmentsY = 24, segmentsRadial = 32) {
        const points = [];
        // Convergent inlet arc
        points.push(new THREE.Vector2(rThroat * 1.35, -length * 0.15));
        points.push(new THREE.Vector2(rThroat * 1.10, -length * 0.05));
        points.push(new THREE.Vector2(rThroat, 0));

        // Parabolic expansion curve
        for (let i = 1; i <= segmentsY; i++) {
          const t = i / segmentsY;
          const r = rThroat + (rExit - rThroat) * (0.62 * t + 0.38 * t * t);
          const y = t * length;
          points.push(new THREE.Vector2(r, y));
        }

        return new THREE.LatheGeometry(points, segmentsRadial);

          case 'rocket':

            cameraTargetLook.set(0, 10.5, 0);

        clampOpen = 0;
        delugeSteamActive = false;

        panelPotencia.style.display = 'none';
        countdownBanner.style.display = 'flex';

        hudStatus.style.color = '#f59e0b';

      function resetLaunch() {

        camera.position.set(14.5, 4.2, 16.0);
        camera.lookAt(0, 6.0, 0);

        hudDot.style.backgroundColor = '#38bdf8';
        hudDot.style.boxShadow = '0 0 14px rgba(56, 189, 248, 0.4)';
        hudStatus.textContent = 'READY // ESPERA DE IGNICIÓN';
        hudStatus.style.color = '#38bdf8';

        updateTelemetryUI();

      function updateTelemetryUI() {
        telAlt.textContent = (rocketY * 4.2).toFixed(1) + ' m';
        telVel.textContent = (velocity * 24.0).toFixed(0) + ' km/h';

        if (launchPhase === 'countdown') {
          telThrust.textContent = 'CRYO ARMED';
        } else if (launchPhase === 'ignition') {
          telThrust.textContent = '95% SPOOL-UP';
        } else if (launchPhase === 'liftoff' || launchPhase === 'ascent') {
          telThrust.textContent = '100% MAX';
        } else if (launchPhase === 'cruising') {
          telThrust.textContent = '40% NOMINAL';
        } else {
          telThrust.textContent = thrustMode === 'test' ? '100% TEST' : thrustMode === 'standby' ? '35% IDLE' : 'OFFLINE';
        }

      // Window Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ================= MAIN SIMULATION LOOP =================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.getElapsedTime();

        // FAA Red Strobe Beacon at top of Gantry Tower (Synchronized double-flash)
        const strobePhase = (t * 2.5) % 1.0;
        const isStrobe = strobePhase < 0.12 || (strobePhase > 0.22 && strobePhase < 0.34);
        towerBeacon.intensity = isStrobe ? 5.5 : 0.4;
        beaconMesh.material.emissiveIntensity = isStrobe ? 4.5 : 0.8;

        // Platform Caution LEDs pulse
        const ledPulse = 0.55 + Math.sin(t * 3.0) * 0.42;
        padLedsGroup.children.forEach(c => c.material.emissiveIntensity = ledPulse);

        // Grid Fins subtle aerodynamic stabilization micro-rotation in flight
        if (launchPhase === 'liftoff' || launchPhase === 'ascent' || launchPhase === 'cruising') {
          const finTwitch = Math.sin(t * 6.0) * 0.08;
          gridFins.forEach((fg, fi) => {
            fg.children[1].rotation.z = finTwitch * (fi % 2 === 0 ? 1 : -1);
          });
        }

        // ================= LAUNCH SEQUENCE LOGIC =================
        if (launchPhase === 'countdown') {
          phaseTimer += dt;
          if (phaseTimer < 1.0) {
            countdownNum.textContent = 'T - 03';
          } else if (phaseTimer < 2.0) {
            countdownNum.textContent = 'T - 02';
          } else if (phaseTimer < 3.0) {
            countdownNum.textContent = 'T - 01';
            // Start water deluge spray sound suppression 0.6s prior to ignition
            if (phaseTimer > 2.4) delugeSteamActive = true;
          } else {
            // Transition to Octaweb Ignition
            launchPhase = 'ignition';
            phaseTimer = 0;
            delugeSteamActive = true;
            countdownBanner.style.display = 'none';

            hudDot.style.backgroundColor = '#f97316';
            hudDot.style.boxShadow = '0 0 16px rgba(249, 115, 22, 0.8)';
            hudStatus.textContent = 'IGNICIÓN // OCTAWEB 9 MOTORES';
            hudStatus.style.color = '#f97316';
          }
        } else if (launchPhase === 'ignition') {
          phaseTimer += dt;
          delugeSteamActive = true;
          if (phaseTimer >= 1.6) {
            // Full thrust achieved, release hold-down clamps
            launchPhase = 'liftoff';
            phaseTimer = 0;

            hudDot.style.backgroundColor = '#ef4444';
            hudDot.style.boxShadow = '0 0 16px rgba(239, 68, 68, 0.8)';
            hudStatus.textContent = 'DESPEGUE // LIBERACIÓN DE ABRAZADERAS';
            hudStatus.style.color = '#ef4444';
          }
        } else if (launchPhase === 'liftoff') {
          // Hydraulic hold-down clamp release and gantry arm retraction
          armRetract = Math.min(armRetract + dt * 1.5, 1.0);
          clampOpen = Math.min(clampOpen + dt * 2.8, 1.0);

          // Realistic sluggish liftoff inertia (overcoming massive vehicle weight)
          velocity += 2.4 * dt;
          rocketY += velocity * dt;

          if (rocketY > 5.0) {
            launchPhase = 'ascent';
            delugeSteamActive = false;
            hudDot.style.backgroundColor = '#10b981';
            hudDot.style.boxShadow = '0 0 16px rgba(16, 185, 129, 0.8)';
            hudStatus.textContent = 'ASCENSO // TRAYECTORIA NOMINAL';
            hudStatus.style.color = '#10b981';
          }
        } else if (launchPhase === 'ascent') {
          armRetract = 1.0;
          clampOpen = 1.0;

          // Exponential acceleration as propellants burn off
          const accel = 3.6 + Math.min(rocketY * 0.08, 6.5);
          velocity = Math.min(velocity + accel * dt, 26.0);
          rocketY += velocity * dt;

          if (rocketY >= 65.0) {
            launchPhase = 'cruising';
            hudDot.style.backgroundColor = '#00e5ff';
            hudDot.style.boxShadow = '0 0 16px rgba(0, 229, 255, 0.8)';
            hudStatus.textContent = 'INSERCIÓN ORBITAL // VELOCIDAD NOMINAL';
            hudStatus.style.color = '#00e5ff';
          }
        } else if (launchPhase === 'cruising') {
          velocity = Math.max(velocity - dt * 5.0, 3.5);
          rocketY += velocity * dt;
        }

        // Animate Umbilical Service Arms Retraction (Swing smoothly away from rocket)
        upperArmGroup.rotation.y = -armRetract * 0.55;
        midArmGroup.rotation.y = -armRetract * 0.55;

        // Animate Hold-Down Clamps Release (Swing claw out and back, completely clearing rocket path)
        clampGroups.forEach(cg => {
          if (cg.userData.clawGroup) {
            cg.userData.clawGroup.rotation.x = -clampOpen * 0.85;
          }
        });

        // Dynamic Engine Gimbal Micro-Tilt (Closed-loop thrust vector control)
        const isThrusting = ['ignition', 'liftoff', 'ascent', 'cruising'].includes(launchPhase) || thrustMode === 'test';
        if (isThrusting) {
          const gimbalX = Math.sin(t * 12.0) * 0.04;
          const gimbalZ = Math.cos(t * 14.0) * 0.04;
          engineNozzles[0].rotation.set(gimbalX, 0, gimbalZ); // Center gimbal engine
        } else {
          engineNozzles[0].rotation.set(0, 0, 0);
        }

        // Realistic High-Frequency Vehicle Vibration
        let vibX = 0, vibZ = 0, vibY = 0;
        if (launchPhase === 'ignition') {
          vibX = Math.sin(t * 80) * 0.005;
          vibZ = Math.cos(t * 90) * 0.005;
          vibY = Math.sin(t * 120) * 0.0035;
        } else if (launchPhase === 'liftoff' || launchPhase === 'ascent') {
          vibX = Math.sin(t * 55) * 0.0028;
          vibZ = Math.cos(t * 60) * 0.0028;
        } else if (thrustMode === 'test') {
          vibX = Math.sin(t * 75) * 0.006;
          vibZ = Math.cos(t * 85) * 0.006;
        }

        rocketGroup.position.set(vibX, rocketY + vibY, vibZ);

        // Dynamic Plume Expansion & Shock Diamonds Animation
        let targetFlameY = 0.001;
        let targetFlameXZ = 0.001;
        let flameIntensity = 0.1;

        if (launchPhase === 'ascent' || launchPhase === 'liftoff' || thrustMode === 'test') {
          const flutter = 1.0 + Math.sin(t * 48.0) * 0.07;
          // Plume expands laterally as atmospheric pressure drops with altitude
          const expansionFactor = 1.0 + Math.min(rocketY * 0.018, 0.65);
          targetFlameY = (launchPhase === 'ascent' ? 3.6 : 2.8) * flutter;
          targetFlameXZ = 1.5 * flutter * expansionFactor;
          flameIntensity = 38;
        } else if (launchPhase === 'ignition') {
          targetFlameY = 2.2;
          targetFlameXZ = 1.25;
          flameIntensity = 28;
        } else if (launchPhase === 'cruising') {
          targetFlameY = 1.8;
          targetFlameXZ = 1.9; // Highly expanded vacuum plume
          flameIntensity = 18;
        } else if (thrustMode === 'standby' || launchPhase === 'countdown') {
          targetFlameY = 0.6;
          targetFlameXZ = 0.55;
          flameIntensity = 4;
        }

        flameGroup.position.y = 1.55 + rocketY;
        flameGroup.scale.y = THREE.MathUtils.lerp(flameGroup.scale.y, targetFlameY, dt * 14);
        flameGroup.scale.x = THREE.MathUtils.lerp(flameGroup.scale.x, targetFlameXZ, dt * 14);
        flameGroup.scale.z = THREE.MathUtils.lerp(flameGroup.scale.z, targetFlameXZ, dt * 14);

        // Supersonic Mach Shock Diamonds high-frequency oscillation
        shockDiamonds.forEach((sd, si) => {
          const sScale = 0.9 + Math.sin(t * 60 + si * 1.5) * 0.15;
          sd.scale.set(sScale, sScale, sScale);
          sd.visible = isThrusting && flameGroup.scale.y > 1.2;
        });

        // Throats Emissive Heat Pulsing
        const throatHeat = isThrusting ? 3.5 + Math.sin(t * 25) * 0.8 : 0.8;
        glowingThroats.forEach(gt => gt.material.emissiveIntensity = throatHeat);

        flameLight.position.y = 0.8 + rocketY;
        flameLight.intensity = THREE.MathUtils.lerp(flameLight.intensity, flameIntensity, dt * 12);
        coreGlowLight.position.y = 1.6 + rocketY;
        coreGlowLight.intensity = isThrusting ? 8.0 : 0.0;

        // Cryogenic LOX Boil-off Vapor Wisps (Active before launch)
        if (cryoPoints) {
          const cArr = cryoPoints.geometry.attributes.position.array;
          const isVenting = launchPhase === 'standby' || launchPhase === 'countdown';

          for (let i = 0; i < cryoCount; i++) {
            cryoAges[i] += dt;
            if (cryoAges[i] >= cryoMax[i]) {
              cryoAges[i] = 0;
              if (isVenting) {
                // Vent from interstage relief valves at y = 12.8m
                const ang = Math.random() * Math.PI * 2;
                cArr[i * 3 + 0] = Math.cos(ang) * 0.46;
                cArr[i * 3 + 1] = 12.8 + (Math.random() - 0.5) * 0.3;
                cArr[i * 3 + 2] = Math.sin(ang) * 0.46;

                cryoVel[i * 3 + 0] = Math.cos(ang) * 0.35 + 0.15; // Ambient breeze
                cryoVel[i * 3 + 1] = -0.15 - Math.random() * 0.3; // Cold dense cryo vapor sinks gently
                cryoVel[i * 3 + 2] = Math.sin(ang) * 0.35;
              } else {
                cArr[i * 3 + 1] = -100;
              }
            } else if (cArr[i * 3 + 1] > -50) {
              cArr[i * 3 + 0] += cryoVel[i * 3 + 0] * dt;
              cArr[i * 3 + 1] += cryoVel[i * 3 + 1] * dt;
              cArr[i * 3 + 2] += cryoVel[i * 3 + 2] * dt;
            }
          }
          cryoPoints.geometry.attributes.position.needsUpdate = true;
        }

        // Water Deluge Sound Suppression Steam (Massive boiling steam at flame trench)
        if (delugePoints) {
          const dArr = delugePoints.geometry.attributes.position.array;
          for (let i = 0; i < delugeCount; i++) {
            delugeAges[i] += dt;
            if (delugeAges[i] >= delugeMax[i]) {
              delugeAges[i] = 0;
              if (delugeSteamActive && isThrusting && rocketY < 12.0) {
                // Eject from trench deflector base
                const dAng = Math.random() * Math.PI * 2;
                const r0 = 0.5 + Math.random() * 1.5;
                dArr[i * 3 + 0] = Math.cos(dAng) * r0;
                dArr[i * 3 + 1] = 0.4 + Math.random() * 0.6;
                dArr[i * 3 + 2] = Math.sin(dAng) * r0;

                // High-velocity horizontal radial expansion
                const speed = 4.5 + Math.random() * 5.5;
                delugeVel[i * 3 + 0] = Math.cos(dAng) * speed;
                delugeVel[i * 3 + 1] = 0.8 + Math.random() * 1.6; // Rising thermal steam
                delugeVel[i * 3 + 2] = Math.sin(dAng) * speed;
              } else {
                dArr[i * 3 + 1] = -100;
              }
            } else if (dArr[i * 3 + 1] > -50) {
              dArr[i * 3 + 0] += delugeVel[i * 3 + 0] * dt;
              dArr[i * 3 + 1] += delugeVel[i * 3 + 1] * dt;
              dArr[i * 3 + 2] += delugeVel[i * 3 + 2] * dt;
              delugeVel[i * 3 + 0] *= 0.96; // Aerodynamic drag
              delugeVel[i * 3 + 2] *= 0.96;
            }
          }
          delugePoints.geometry.attributes.position.needsUpdate = true;
        }

        // Ascent Rocket Smoke Trail
        if (smokePoints) {
          const sArr = smokePoints.geometry.attributes.position.array;
          const isAscending = launchPhase === 'liftoff' || launchPhase === 'ascent' || launchPhase === 'cruising';

          for (let i = 0; i < smokeCount; i++) {
            smokeAges[i] += dt;
            if (smokeAges[i] >= smokeMax[i]) {
              smokeAges[i] = 0;
              if (isThrusting) {
                const ang = Math.random() * Math.PI * 2;
                const r = Math.random() * 0.4;
                sArr[i * 3 + 0] = Math.cos(ang) * r;
                sArr[i * 3 + 1] = 1.0 + rocketY;
                sArr[i * 3 + 2] = Math.sin(ang) * r;

                if (isAscending) {
                  smokeVel[i * 3 + 0] = Math.cos(ang) * 0.8;
                  smokeVel[i * 3 + 1] = -5.0 - Math.random() * 4.0;
                  smokeVel[i * 3 + 2] = Math.sin(ang) * 0.8;
                } else {
                  smokeVel[i * 3 + 0] = Math.cos(ang) * 2.2;
                  smokeVel[i * 3 + 1] = -0.4;
                  smokeVel[i * 3 + 2] = Math.sin(ang) * 2.2;
                }
              } else {
                sArr[i * 3 + 1] = -100;
              }
            } else if (sArr[i * 3 + 1] > -50) {
              sArr[i * 3 + 0] += smokeVel[i * 3 + 0] * dt;
              sArr[i * 3 + 1] += smokeVel[i * 3 + 1] * dt;
              sArr[i * 3 + 2] += smokeVel[i * 3 + 2] * dt;
            }
          }
          smokePoints.geometry.attributes.position.needsUpdate = true;
        }

        // Continuous, Framerate-Independent Camera Tracking During Launch & Flight
        const isFlight = launchPhase === 'liftoff' || launchPhase === 'ascent' || launchPhase === 'cruising';
        if (isFlight) {
          // 1. Target of Interest: Mid-upper vehicle axis (rocket is 20.6m tall from engine bells to fairing apex)
          // Looking at rocketY + 13.5m centers the entire launch stack and trailing flame plume symmetrically
          const targetLookY = 13.5 + rocketY;
          controls.target.x = THREE.MathUtils.damp(controls.target.x, 0, 6.0, dt);
          controls.target.y = THREE.MathUtils.damp(controls.target.y, targetLookY, 8.0, dt);
          controls.target.z = THREE.MathUtils.damp(controls.target.z, 0, 6.0, dt);

          // 2. Camera Vantage Position: Eye elevation tracks the vehicle synchronously at identical rate (lambda 8.0)
          const targetEyeY = 12.5 + rocketY;
          // Smooth progressive distance expansion so the ascending rocket and full plume stay in view
          const distMult = 1.0 + Math.min(rocketY * 0.015, 0.85);
          const targetEyeX = 18.0 * distMult;
          const targetEyeZ = 20.0 * distMult;

          camera.position.x = THREE.MathUtils.damp(camera.position.x, targetEyeX, 5.0, dt);
          camera.position.y = THREE.MathUtils.damp(camera.position.y, targetEyeY, 8.0, dt);
          camera.position.z = THREE.MathUtils.damp(camera.position.z, targetEyeZ, 5.0, dt);
        } else {
          // Pre-launch & Standby: Smooth interpolation between inspection presets (PAD, COHETE, MOTOR, TORRE)
          camera.position.lerp(cameraTargetPos, dt * 3.5);
          controls.target.lerp(cameraTargetLook, dt * 3.5);
        }

        if (autoRotate && launchPhase === 'standby') {
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.8;
        } else {
          controls.autoRotate = false;
        }

        controls.update();
        updateTelemetryUI();
        renderer.render(scene, camera);
      }

      window.setCameraPreset = setCameraPreset;
      window.toggleAutoRotate = toggleAutoRotate;
      window.setThrustMode = setThrustMode;
      window.startLaunch = startLaunch;
      window.resetLaunch = resetLaunch;

      // URL parameters for interactive inspection & automated verification
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const pPreset = urlParams.get('preset');
        if (pPreset) {
          setCameraPreset(pPreset);
          camera.position.copy(cameraTargetPos);
          controls.target.copy(cameraTargetLook);
        }
        if (urlParams.get('launch') === '1') {
          startLaunch();
          const fastAlt = parseFloat(urlParams.get('alt'));
          if (!isNaN(fastAlt) && fastAlt > 0) {
            launchPhase = 'ascent';
            rocketY = fastAlt;
            velocity = 18.0;
            armRetract = 1.0;
            clampOpen = 1.0;
            countdownBanner.style.display = 'none';
            hudDot.style.backgroundColor = '#10b981';
            hudStatus.textContent = 'ASCENSO // TRAYECTORIA NOMINAL';
            hudStatus.style.color = '#10b981';

            // Synchronously position camera at vehicle altitude
            const distMult = 1.0 + Math.min(fastAlt * 0.015, 0.85);
            controls.target.set(0, 13.5 + fastAlt, 0);
            camera.position.set(18.0 * distMult, 12.5 + fastAlt, 20.0 * distMult);
          }
        }
      } catch (e) {}

      animate();
    }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initRocketApp);
  } else {
    initRocketApp();
  }
</script>
</body>
